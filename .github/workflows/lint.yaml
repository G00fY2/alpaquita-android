name: "Linting"

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sh-checker:
    name: "Shell Checker (shellcheck, shfmt, checkbashisms)"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Run sh-checker"
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        with:
          sh_checker_checkbashisms_enable: true

  yamllint:
    name: "Yamllint"
    runs-on: ubuntu-24.04
    env:
      YAMLLINT_VERSION: 1.38.0
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Check for .yml extensions"
        env:
          EXCLUDE: '\.github/ISSUE_TEMPLATE/config\.yml'
        run: |
          find . -type f -name "*.yml" | \
            grep -v "$EXCLUDE" | \
            grep . && { echo "Error: Use .yaml instead of .yml"; exit 1; } || exit 0

      - name: "Install yamllint"
        run: pip install yamllint==${{ env.YAMLLINT_VERSION }}

      - name: "Run yamllint"
        run: yamllint -c .github/.yamllint.yaml .

  renovate-config-validator:
    name: "Renovate config validator"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Run Renovate config validator"
        uses: ./.github/actions/renovate-config-validator

  actionlint:
    name: "Actionlint"
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install actionlint"
        id: install-actionlint
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
          ${{ env.ACTIONLINT_VERSION }}

      - name: "Run actionlint"
        run: ${{ steps.install-actionlint.outputs.executable }} -color

  hadolint:
    name: "Hadolint"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Run Hadolint"
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          verbose: true

      - name: "Hadolint Results"
        if: always()
        run: echo "${HADOLINT_RESULTS:-No issues found.}"

  docker-build-checks:
    name: "Docker Buildx Checks"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        env:
          DOCKER_BUILDX_VERSION: v0.36.1
          DOCKER_BUILDKIT_VERSION: v0.32.2
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          driver-opts: image=moby/buildkit:${{ env.DOCKER_BUILDKIT_VERSION }}

      - name: "Run Buildx Checks"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          call: check
          platforms: linux/amd64
